<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SnowShop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="snowflake-icon">❄️</div>
            <h1>До зимы осталось</h1>
            <div id="countdown-timer">
                <span id="days">00</span>:
                <span id="hours">00</span>:
                <span id="minutes">00</span>:
                <span id="seconds">00</span>
            </div>
            <p class="splash-sub">Готовь сани летом, а сноуборд — прямо сейчас!</p>
            <button id="skip-splash" class="skip-btn">Пропустить</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="main-app" style="display: none;">
        <header class="app-header">
            <div class="header-left">
                <span class="greeting">🏔️ SnowShop</span>
            </div>
            <div class="header-right">
                <span class="user-balance">❄️ 0</span>
            </div>
        </header>

        <main id="catalog"></main>
        <main id="services" style="display: none;"></main>

        <nav class="bottom-nav">
            <button class="nav-btn active" data-tab="catalog" data-category="boards">
                <img src="https://img.icons8.com/ios-filled/50/FFFFFF/snowboard.png" alt="Сноуборды">
            </button>
            <button class="nav-btn" data-tab="catalog" data-category="bindings">
                <img src="https://img.icons8.com/ios-filled/50/FFFFFF/binding.png" alt="Крепления">
            </button>
            <button class="nav-btn" data-tab="catalog" data-category="boots">
                <img src="https://img.icons8.com/ios-filled/50/FFFFFF/snow-boots.png" alt="Ботинки">
            </button>
            <button class="nav-btn" data-tab="catalog" data-category="helmets">
                <img src="https://img.icons8.com/ios-filled/50/FFFFFF/safety-helmet.png" alt="Шлемы">
            </button>
            <button class="nav-btn" data-tab="services" data-category="services">
                <img src="https://img.icons8.com/ios-filled/50/FFFFFF/tools.png" alt="Сервис">
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
