<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
    <title>Snowboard Shop</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        img, a, button {
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="background-layer"></div>

    <div id="splash-screen">
        <video id="splash-video" autoplay muted playsinline loop>
            <source src="Snow.MP4" type="video/mp4" />
        </video>
        <div class="splash-overlay">
            <div class="splash-content"></div>
        </div>
    </div>

    <div id="app" style="display: none;">
        <header>
            <h1>🏔️ Snowboard Store</h1>
        </header>

        <div id="announcement-banner" style="display: none; background: rgba(255, 215, 0, 0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; padding: 10px 14px; margin: 0 0 10px 0; border: 1px solid rgba(255, 215, 0, 0.3);">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 20px;">📢</span>
                <span id="announcement-text" style="color: #ffffff; font-size: 14px; text-shadow: 0 1px 4px rgba(0,0,0,0.3); flex: 1;"></span>
                <button onclick="closeAnnouncement()" style="background: none; border: none; color: rgba(255,255,255,0.6); font-size: 18px; cursor: pointer; padding: 0 4px;">✕</button>
            </div>
        </div>

        <main id="catalog"></main>

        <nav id="bottom-nav"></nav>
    </div>

    <div id="product-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close" id="modal-close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Модалка для приближения с зумом -->
    <div id="image-zoom-modal" class="modal" style="display: none;">
        <div class="modal-content zoom-content" id="zoom-container">
            <span class="modal-close" id="zoom-close">&times;</span>
            <div class="zoom-wrapper" id="zoom-wrapper">
                <img id="zoom-image" src="" alt="Увеличенное фото" draggable="false" />
            </div>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-in-btn">➕</button>
                <button class="zoom-btn" id="zoom-out-btn">➖</button>
                <button class="zoom-btn" id="zoom-reset-btn">⟲</button>
                <span class="zoom-level" id="zoom-level">100%</span>
            </div>
            <div style="text-align: center; color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 8px;">
                🔍 Перетаскивай для просмотра
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.BackButton.hide();
        tg.MainButton.hide();
        tg.onEvent('mainButtonClicked', function() {
            tg.sendData(JSON.stringify({ action: 'close' }));
        });
        window.closeApp = function() {
            tg.close();
        };
        tg.ready();
        
        function closeAnnouncement() {
            document.getElementById('announcement-banner').style.display = 'none';
        }
    </script>
    
    <script src="script.js"></script>
</body>
</html>
