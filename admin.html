<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 50px;
            background: var(--bg-primary);
            min-height: 100vh;
        }
        .admin-container h1 {
            color: var(--accent);
            font-size: 28px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border-light);
        }
        .admin-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .admin-tab.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
        }
        .admin-panel {
            display: none;
        }
        .admin-panel.active {
            display: block;
        }
        .admin-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
        }
        .admin-card input, .admin-card textarea, .admin-card select {
            width: 100%;
            padding: 14px 16px;
            margin: 10px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        .admin-card input:focus, .admin-card textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }
        .admin-card textarea {
            min-height: 80px;
            resize: vertical;
        }
        .admin-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 14px 24px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        .admin-btn:hover {
            opacity: 0.8;
            transform: scale(0.98);
        }
        .product-item, .service-item {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 14px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent);
        }
        .delete-btn {
            background: #ff3b30;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
        }
        .admin-back {
            color: var(--accent);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
        .service-item .service-info {
            flex: 1;
        }
        .service-item .service-info strong {
            display: block;
            font-size: 16px;
        }
        .service-item .service-info .service-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .service-item .service-actions {
            display: flex;
            gap: 8px;
        }
        .edit-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        @media (max-width: 480px) {
            .admin-container {
                padding: 15px;
                padding-top: 30px;
            }
            .admin-tabs {
                flex-direction: row;
            }
            .admin-tab {
                font-size: 12px;
                padding: 10px;
            }
            .product-item, .service-item {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .service-item .service-actions {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <a href="index.html" class="admin-back">← Назад в витрину</a>
        <h1>⚙️ Админ-панель</h1>
        
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="products">Товары</button>
            <button class="admin-tab" data-tab="services-tab">Услуги</button>
        </div>

        <div id="products-panel" class="admin-panel active">
            <div class="admin-card">
                <h3>➕ Добавить товар</h3>
                <input type="text" id="product-name" placeholder="Название">
                <input type="text" id="product-price" placeholder="Цена (например: 45 000 ₽)">
                <input type="text" id="product-image" placeholder="URL изображения">
                <select id="product-category">
                    <option value="boards">Сноуборды</option>
                    <option value="bindings">Крепления</option>
                    <option value="boots">Ботинки</option>
                    <option value="helmets">Шлемы</option>
                </select>
                <textarea id="product-desc" placeholder="Описание и характеристики"></textarea>
                <button class="admin-btn" onclick="addProduct()">Добавить товар</button>
            </div>

            <div class="admin-card">
                <h3>📦 Управление товарами</h3>
                <div id="product-list-admin"></div>
            </div>
        </div>

        <div id="services-panel" class="admin-panel">
            <div class="admin-card">
                <h3>🔧 Добавить услугу</h3>
                <input type="text" id="service-name" placeholder="Название услуги">
                <input type="text" id="service-price" placeholder="Цена (например: 3 500 ₽)">
                <textarea id="service-desc" placeholder="Описание услуги"></textarea>
                <button class="admin-btn" onclick="addService()">Добавить услугу</button>
            </div>

            <div class="admin-card">
                <h3>📋 Управление услугами</h3>
                <div id="service-list-admin"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
